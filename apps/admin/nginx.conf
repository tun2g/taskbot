server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The nginx image ships with gzip off; without this the JS bundle goes out uncompressed.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Admin pages are private; keep them out of search engines and frames.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }

  # SPA fallback for TanStack Router client-side routes. `/api` is routed to apps/admin-api by the
  # reverse proxy in front of this container, so it never reaches here.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    try_files $uri $uri/ /index.html;
  }
}
