server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The nginx image ships with gzip off; without this the JS bundle goes out uncompressed.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/xml application/xml;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~ ^/(og-image\.png|apple-touch-icon\.png|demo-poster\.jpg)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location = /demo.mp4 {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location ~ ^/(robots\.txt|sitemap\.xml|favicon\.svg)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # nginx's mime.types has no entry for .webmanifest.
  location = /site.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Single page: unknown paths get the landing page but with a real 404 status, so search engines don't index them
  # as duplicates of the home page (soft 404).
  error_page 404 /index.html;
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}
