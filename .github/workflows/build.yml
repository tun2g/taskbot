name: Build and push images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: bot
            file: Dockerfile
          - app: web
            file: apps/web/Dockerfile
          - app: admin-api
            file: apps/admin-api/Dockerfile
          - app: admin
            file: apps/admin/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/tun2g/taskbot-${{ matrix.app }}:latest
            ghcr.io/tun2g/taskbot-${{ matrix.app }}:sha-${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api' }}
            VITE_BOT_USERNAME=${{ vars.VITE_BOT_USERNAME }}
          cache-from: type=gha,scope=taskbot-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=taskbot-${{ matrix.app }}
